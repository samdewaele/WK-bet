app = "wk-bet-2026"
primary_region = "ams"

[build]

[env]
  PORT         = "3000"
  NODE_ENV     = "production"
  DATABASE_URL = "file:/data/prod.db"
  NEXT_PUBLIC_BASE_URL = "https://wk-bet-2026.fly.dev"

[http_service]
  internal_port        = 3000
  force_https          = true
  auto_stop_machines   = "stop"
  auto_start_machines  = true
  min_machines_running = 0

[[vm]]
  memory   = "512mb"
  cpu_kind = "shared"
  cpus     = 1

[[mounts]]
  source       = "wkbet_data"
  destination  = "/data"
  initial_size = "1gb"
