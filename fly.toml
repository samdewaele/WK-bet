# fly.toml app configuration file generated for wk-bet on 2026-05-26T07:54:54Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'wk-bet'
primary_region = 'ams'

[build]

[env]
  DATABASE_URL = 'file:/data/prod.db'
  NEXT_PUBLIC_BASE_URL = 'https://wk-bet.fly.dev'
  NODE_ENV = 'production'
  PORT = '3000'

[[mounts]]
  source = 'wkbet_data'
  destination = '/data'
  initial_size = '1gb'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "40s"
    interval     = "10s"
    timeout      = "5s"
    method       = "GET"
    path         = "/"

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
